<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather AI</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(255,255,255,0.06);
      --accent: #60a5fa;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #e6eef8;
      -webkit-font-smoothing:antialiased;
    }
    .app {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:24px;
      box-sizing:border-box;
      gap:16px;
    }
    header {
      width:100%;
      max-width:1100px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo {
      width:44px;
      height:44px;
      border-radius:10px;
      background:linear-gradient(135deg,#7dd3fc,#60a5fa);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:#023047;
      box-shadow:0 6px 18px rgba(2,48,71,0.35);
    }
    h1 {font-size:1.125rem; margin:0;}
    p.lead {margin:0;opacity:0.8;font-size:0.9rem}
    main {
      flex:1;
      width:100%;
      max-width:1100px;
      display:flex;
      background:var(--card);
      border-radius:12px;
      padding:12px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      box-sizing:border-box;
      min-height:60vh;
    }
    .iframe-wrap {
      flex:1;
      border-radius:8px;
      overflow:hidden;
      background:rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
    }
    iframe {width:100%; height:100%; border:0; display:block;}
    footer {width:100%;max-width:1100px;text-align:right;font-size:0.8rem;opacity:0.6}
    @media (max-width:640px){ h1{font-size:1rem} .logo{width:40px;height:40px} main{padding:8px} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">W</div>
        <div>
          <h1>Weather AI</h1>
          <p class="lead">실시간 날씨 정보를 대화형으로 확인하세요.</p>
        </div>
      </div>
      <div style="opacity:.85;font-size:.9rem">Updated style — 깔끔하고 부드러운 레이아웃</div>
    </header>
    <main>
      <div class="iframe-wrap">
        <iframe src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_k-weatheraiagent_LJgjEd/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" allow="clipboard-read;clipboard-write;geolocation" title="Weather chat"></iframe>
      </div>
    </main>
    <footer>Made by saturn417</footer>
  </div>
</body>
</html>
