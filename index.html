<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather AI — 화성시</title>
  <style>
    :root{
      --accent: #60a5fa;
      --glass-border: rgba(255,255,255,0.18);
      --card-bg: rgba(255,255,255,0.08);
      --text-dark: #06253a;
    }
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
    body{
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=80');
      background-size:cover;background-position:center;
      display:flex;align-items:center;justify-content:center;padding:28px;color:var(--text-dark);
    }

    /* 전체 카드 감싸기 */
    .container{
      width:min(1100px,96%);
      max-width:1100px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .card {
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      border:1px solid var(--glass-border);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      box-shadow: 0 18px 48px rgba(2,6,23,0.45);
      padding:22px;
      box-sizing:border-box;
    }

    /* 상단 대형 예보 영역 */
    .forecast{
      display:flex;gap:20px;align-items:center;
      min-height:360px;border-radius:20px;padding:28px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      position:relative;overflow:hidden;
    }
    .forecast .left{flex:1;display:flex;flex-direction:column;gap:10px}
    .city{font-size:1rem;font-weight:700;opacity:0.95}
    .updated{font-size:0.9rem;opacity:0.75}
    .temp{font-size:7.5rem;font-weight:800;line-height:0.85;margin:6px 0;color:#021526}
    .condition{display:flex;align-items:center;gap:12px}
    .cond-icon{width:86px;height:86px;border-radius:18px;background:linear-gradient(135deg,#fff 10%,rgba(255,255,255,0.6));display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 30px rgba(2,6,23,0.14)}

    /* 우측 요약 */
    .summary{width:320px;display:flex;flex-direction:column;gap:12px}
    .card-mini{background:rgba(255,255,255,0.06);border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,0.06)}
    .highlow{display:flex;gap:12px;justify-content:space-between}

    /* 시간별 타임라인 */
    .timeline{margin-top:12px;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,0.02);overflow:auto}
    .hour{min-width:78px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));border-radius:12px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,0.03)}
    .hour.active{box-shadow:0 8px 22px rgba(2,6,23,0.12);transform:translateY(-4px)}
    .hour .h{font-weight:700}
    .hour .deg{font-size:1.25rem;margin-top:6px}

    /* 챗봇 영역 - 하단 */
    .chatbot-wrap{height:320px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));}
    .chatbot-wrap iframe{width:100%;height:100%;border:0;display:block}

    /* 위치 칩 */
    .location-chip{position:absolute;left:28px;top:18px;background:rgba(255,255,255,0.9);color:#06253a;padding:8px 14px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(2,6,23,0.06)}

    footer{color:rgba(2,6,23,0.6);font-size:0.85rem;text-align:right}

    @media (max-width:900px){
      .forecast{flex-direction:column;align-items:flex-start}
      .summary{width:100%}
      .temp{font-size:5rem}
      .chatbot-wrap{height:300px}
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="card forecast" aria-label="대형 예보 카드">
      <div class="location-chip">화성시</div>

      <div class="left">
        <div class="updated">실시간 관측 · 15:00</div>
        <div class="city">화성시</div>
        <div class="temp" id="temp">32<span style="font-size:0.35em">°</span></div>
        <div class="condition">
          <div class="cond-icon">☀️</div>
          <div>
            <div style="font-weight:800;font-size:1.05rem">맑음</div>
            <div style="opacity:0.75;margin-top:6px">체감 31° · 강수확률 0% · 습도 60%</div>
          </div>
        </div>

        <div style="margin-top:18px">
          <div style="font-weight:700;margin-bottom:8px">타임라인</div>
          <div class="timeline" id="timeline">
            <div class="hour"> <div class="h">14:00</div> <div class="deg">30°</div> <div style="opacity:.7">☀️</div></div>
            <div class="hour active"> <div class="h">15:00</div> <div class="deg">32°</div> <div style="opacity:.7">☀️</div></div>
            <div class="hour"> <div class="h">16:00</div> <div class="deg">32°</div> <div style="opacity:.7">☀️</div></div>
            <div class="hour"> <div class="h">17:00</div> <div class="deg">31°</div> <div style="opacity:.7">🌤️</div></div>
            <div class="hour"> <div class="h">18:00</div> <div class="deg">30°</div> <div style="opacity:.7">🌥️</div></div>
            <div class="hour"> <div class="h">19:00</div> <div class="deg">28°</div> <div style="opacity:.7">🌥️</div></div>
            <div class="hour"> <div class="h">20:00</div> <div class="deg">27°</div> <div style="opacity:.7">🌙</div></div>
          </div>
        </div>
      </div>

      <aside class="summary">
        <div class="card-mini">
          <div style="font-weight:800">오늘</div>
          <div style="margin-top:8px" class="highlow"><div>최고 32°</div><div>최저 26°</div></div>
        </div>

        <div class="card-mini">
          <div style="font-weight:800">기상 정보</div>
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
            <div>풍속 0.5 m/s</div>
            <div>습도 60%</div>
            <div>미세먼지 보통</div>
          </div>
        </div>

        <div class="card-mini" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)">화성시 기준</div>
      </aside>
    </div>

    <!-- 챗봇은 하단에 배치 -->
    <div class="card chatbot-wrap" aria-label="챗봇">
      <iframe id="botIframe" src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_k-weatheraiagent_LJgjEd/webchat?__version__=2&enableFileAttachment=false&cliAgent=true&initialLocation=%ED%99%94%EC%84%B1%EC%8B%9C" allow="clipboard-read;clipboard-write;geolocation" title="Weather chat"></iframe>
    </div>

    <footer>Made by saturn417</footer>
  </div>

  <script>
    // UI: (옵션) 향후 실제 API로 교체 가능 — 현재는 기본 텍스트로 예시 표시
    // 챗봇에 초기 위치를 보냄(postMessage) — 내부 봇이 수신하면 기본 위치로 설정
    const iframe = document.getElementById('botIframe');
    function postInitialLocation(){
      const msg = {type:'setLocation', location:'화성시'};
      try{ iframe.contentWindow?.postMessage(msg, '*'); }catch(e){ /* cross-origin일 경우 실패 가능 */ }
    }
    iframe.addEventListener('load', ()=>{ postInitialLocation(); });

    // (선택) 타임라인 클릭으로 활성 시간 변경
    document.getElementById('timeline').addEventListener('click', (e)=>{
      const hourEl = e.target.closest('.hour');
      if(!hourEl) return;
      document.querySelectorAll('.hour').forEach(h=>h.classList.remove('active'));
      hourEl.classList.add('active');
      // 예시: 온도 텍스트 업데이트
      const deg = hourEl.querySelector('.deg')?.textContent || '';
      if(deg) document.getElementById('temp').innerHTML = deg.replace('°','') + '<span style="font-size:0.35em">°</span>';
    });
  </script>
</body>
</html>
