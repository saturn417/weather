<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather AI — 화성시</title>
  <style>
    :root{
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.18);
      --chip-bg: rgba(255,255,255,0.9);
      --accent: rgba(96,165,250,0.95);
    }
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
    body{
      /* 배경: 푸른 하늘+초원 느낌 이미지 + 그라데이션 오버레이 */
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=80');
      background-size:cover;background-position:center;
      display:flex;align-items:center;justify-content:center;padding:32px;
      color:#06253a;
    }
    /* 반투명 흐림(글래스모피즘) 전체 래퍼 */
    .card {
      width:min(1100px,95%);
      min-height:60vh;
      background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border-radius:28px;
      box-shadow: 0 20px 50px rgba(2,6,23,0.45);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      padding:28px;
      box-sizing:border-box;
      position:relative;
      overflow:hidden;
    }
    /* 희미한 흰색 안개 효과 레이어 */
    .card::before{
      content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.06));pointer-events:none;border-radius:28px;
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .title{display:flex;align-items:center;gap:12px}
    .logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#34d399);display:flex;align-items:center;justify-content:center;font-weight:800;color:#023047;box-shadow:0 8px 20px rgba(2,48,71,0.18)}
    h1{margin:0;font-size:1.25rem}
    p.lead{margin:0;opacity:0.85}

    /* 위치 칩 — 왼쪽 상단 (화성시) */
    .location-chip{position:absolute;left:28px;top:28px;background:rgba(255,255,255,0.85);color:#06253a;padding:8px 14px;border-radius:999px;font-weight:600;box-shadow:0 6px 18px rgba(2,6,23,0.08)}

    main{display:flex;gap:18px}
    .iframe-wrap{flex:1;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));height:66vh}
    iframe{width:100%;height:100%;border:0;display:block}

    /* 하단 입력 바 영역 */
    .input-row{margin-top:18px;display:flex;align-items:center;gap:12px}
    .input{flex:1;background:rgba(255,255,255,0.12);border-radius:999px;padding:12px 16px;border:1px solid rgba(255,255,255,0.06);color:#06253a}
    .send{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;border:none;cursor:pointer;box-shadow:0 8px 18px rgba(96,165,250,0.18)}

    footer{position:absolute;right:22px;bottom:18px;color:rgba(2,6,23,0.6);font-size:0.85rem}

    @media (max-width:720px){.card{padding:16px}.iframe-wrap{height:50vh}.logo{width:44px;height:44px}.location-chip{left:16px;top:16px}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="location-chip" id="locationChip">화성시</div>
    <header>
      <div class="title">
        <div class="logo">W</div>
        <div>
          <h1>Weather AI</h1>
          <p class="lead">실시간 날씨를 대화형으로 확인하세요 — 기본 위치: 화성시</p>
        </div>
      </div>
      <div style="opacity:.85;font-size:.95rem">Online</div>
    </header>

    <main>
      <div class="iframe-wrap" aria-hidden="false">
        <iframe id="botIframe" src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_k-weatheraiagent_LJgjEd/webchat?__version__=2&enableFileAttachment=false&cliAgent=true&initialLocation=%ED%99%94%EC%84%B1%EC%8B%9C" allow="clipboard-read;clipboard-write;geolocation" title="Weather chat"></iframe>
      </div>
    </main>

    <div class="input-row" aria-hidden>
      <input class="input" placeholder="날씨 관련 무엇이든 물어보세요 — 화성시 기본 설정" />
      <button class="send">→</button>
    </div>

    <footer>Made by saturn417</footer>
  </div>

  <script>
    // iframe에 메시지를 보내 초기 위치를 설정하려 시도합니다. (봇이 postMessage를 처리하면 동작)
    const iframe = document.getElementById('botIframe');
    function postInitialLocation(){
      const msg = {type:'setLocation', location:'화성시'};
      iframe.contentWindow?.postMessage(msg, '*');
      // 또한 URL 파라미터(initialLocation)도 첨부되어 있어, 내부에서 이를 읽어 처리할 수 있다면 기본 위치로 반영됩니다.
    }
    iframe.addEventListener('load', ()=>{ try{ postInitialLocation(); }catch(e){} });
  </script>
</body>
</html>
